  risk_per_trade_pct: 0.01
  atr_multiple: 2.5
  max_position_pct: 0.25
  min_stop_pct: 0.015
accounts:
  cash_reserve: 0.2
  subaccounts:
  - name: a_pullback
    strategy: pullback
    weight: 0.8
    enabled: true
    params:
      ma_trend: 60
      ma_pullback: 20
      pullback_tolerance: 0.02
      volume_ma: 20
      volume_shrink_ratio: 0.7
      rsi_period: 14
      rsi_max: 65
    risk:
      max_positions: 4
      max_hold_days: 20
