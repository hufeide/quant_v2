    max_age_days: 7
constraints:
  enabled: true
  max_pending_bars: 10
  limit:
    enabled: true
    main: 0.1
    star: 0.2
    chinext: 0.2
    bse: 0.3
    st: 0.05
    st_symbols: []
    tick: 0.01
  suspension:
    enabled: true
    require_volume: true
  participation:
    enabled: true
    max_rate: 0.1
engine:
  run_mode: backtest
  lot_size: 100
  trading_days_per_year: 252
  risk_free_rate: 0.02
  verbose: false
  trade_start: null
broker:
  cash: 1000000.0
  commission: 0.0003
  min_commission: 5.0
  stamp_duty: 0.0005
  slippage_perc: 0.001
  slippage_open: true
risk_defaults:
  max_positions: 8
  max_total_exposure_pct: 0.95
  max_position_pct: 0.25
  atr_multiple: 2.5
  take_profit_atr: 5.0
  trailing_stop_atr: 0.0
  max_hold_days: 30
  max_drawdown_stop: 0.35
  max_daily_entries: 3
