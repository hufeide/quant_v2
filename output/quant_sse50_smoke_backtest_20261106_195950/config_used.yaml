project:
  name: quant_sse50_smoke
paths:
  data_dir: /home/administator/workspace/temp_20261106_01/data
  output_dir: /home/administator/workspace/temp_20261106_01/output
data:
  provider: auto
  universe_source: csindex
  index_code: '000016'
  universe_name: sse50
  universe_ttl_days: 30
  cache_dir: /home/administator/workspace/temp_20261106_01/data/cache/daily
  universe_dir: /home/administator/workspace/temp_20261106_01/data/cache/universe
